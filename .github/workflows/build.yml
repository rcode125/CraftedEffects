name: Build CraftedEffects

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate and build add-on
        run: python scripts/build_addon.py
      - uses: actions/upload-artifact@v4
        with:
          name: CraftedEffects
          path: build/*.mcaddon
          retention-days: 30

  gametests:
    runs-on: ubuntu-latest
    needs: validate-and-build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Cache Bedrock Dedicated Server
        uses: actions/cache@v4
        with:
          path: tests/.bds/cache
          key: bds-${{ runner.os }}-${{ hashFiles('tests/bds-runner.json', 'tests/gametest_pack/manifest.json') }}
      - name: Install test runner
        working-directory: tests
        run: npm ci
      - name: Run GameTests on Bedrock Dedicated Server
        working-directory: tests
        run: npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gametest-logs
          path: |
            tests/.bds/logs/
            tests/.bds/result.json
          retention-days: 14

  # Public download without a GitHub account: every green run on main publishes
  # the add-on as a GitHub Release (tag v<version> from the manifest).
  release:
    runs-on: ubuntu-latest
    needs: [validate-and-build, gametests]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build add-on
        run: python scripts/build_addon.py
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(python -c "import json;print('.'.join(map(str,json.load(open('behavior_pack/manifest.json'))['header']['version'])))")
          TAG="v$VERSION"
          cp "build/CraftedEffects-$VERSION.mcaddon" build/CraftedEffects.mcaddon
          cat > release-notes.md <<NOTES
          **Download:** \`CraftedEffects-$VERSION.mcaddon\` unten unter *Assets* anklicken und mit Minecraft öffnen.

          Für Minecraft Bedrock 26.3 – normale Welten und Realms. Alle Rezepte, Effekte und Befehle: [RELIKTE.md](https://github.com/${{ github.repository }}/blob/$TAG/RELIKTE.md)

          Gebaut aus ${{ github.sha }}; alle GameTests auf Bedrock Dedicated Server bestanden.
          NOTES
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "build/CraftedEffects-$VERSION.mcaddon" build/CraftedEffects.mcaddon --clobber
            gh release edit "$TAG" --notes-file release-notes.md
          else
            gh release create "$TAG" "build/CraftedEffects-$VERSION.mcaddon" build/CraftedEffects.mcaddon \
              --title "CraftedEffects $VERSION" --notes-file release-notes.md --target "${{ github.sha }}" --latest
          fi
