name: Build CraftedEffects

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate and build add-on
        run: python scripts/build_addon.py
      - uses: actions/upload-artifact@v4
        with:
          name: CraftedEffects
          path: build/*.mcaddon
          retention-days: 30

  gametests:
    runs-on: ubuntu-latest
    needs: validate-and-build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Cache Bedrock Dedicated Server
        uses: actions/cache@v4
        with:
          path: tests/.bds/cache
          key: bds-${{ runner.os }}-${{ hashFiles('tests/bds-runner.json', 'tests/gametest_pack/manifest.json') }}
      - name: Install test runner
        working-directory: tests
        run: npm ci
      - name: Run GameTests on Bedrock Dedicated Server
        working-directory: tests
        run: npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gametest-logs
          path: |
            tests/.bds/logs/
            tests/.bds/result.json
          retention-days: 14
